limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 10m;
  location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://app:3000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; }
  location / { proxy_pass http://app:3000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; }
}
